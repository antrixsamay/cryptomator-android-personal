name: Build Custom Cryptomator APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: 'cryptomator/android'
          ref: 'main'
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK and Accept Licenses Automatically
        run: |
          # Install Android command-line tools if not present, and auto-accept all licenses
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Inject License Bypass Code
        run: |
          TARGET_FILE="domain/src/main/java/org/cryptomator/domain/usecases/DoLicenseCheck.java"
          mkdir -p "$(dirname "$TARGET_FILE")"
          
          cat << 'EOF' > "$TARGET_FILE"
          package org.cryptomator.domain.usecases;

          import org.cryptomator.domain.exception.BackendException;
          import org.cryptomator.generator.Parameter;
          import org.cryptomator.generator.UseCase;
          import org.cryptomator.util.SharedPreferencesHandler;

          @UseCase
          public class DoLicenseCheck {

              private final SharedPreferencesHandler sharedPreferencesHandler;
              private String license;

              DoLicenseCheck(final SharedPreferencesHandler sharedPreferencesHandler, @Parameter final String license) {
                  this.sharedPreferencesHandler = sharedPreferencesHandler;
                  this.license = license;
              }

              public LicenseCheck execute() throws BackendException {
                  return () -> "Bypassed";
              }
          }
          EOF
          
          echo "Successfully injected license bypass code into $TARGET_FILE"

      - name: Generate Temporary Signing Keystore On-The-Fly
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias cryptomator-key \
            -keypass password123 -storepass password123 \
            -dname "CN=Cryptomator Builder, OU=Dev, O=Custom, L=Unknown, ST=Unknown, C=US"
          
          mkdir -p app/
          mv release.jks app/keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK with apksigner
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: Could not find built APK."
            exit 1
          fi
          
          echo "Found APK: $UNSIGNED_APK"
          
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          
          if [ ! -f "$APKSIGNER" ]; then
            echo "Error: apksigner not found."
            exit 1
          fi
          
          $APKSIGNER sign --ks app/keystore.jks \
            --ks-key-alias cryptomator-key \
            --ks-pass pass:password123 \
            --key-pass pass:password123 \
            "$UNSIGNED_APK"
            
          echo "APK successfully signed!"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptomator-unlicensed-release
          path: app/build/outputs/apk/release/*.apk
