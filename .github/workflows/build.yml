name: Build Custom Cryptomator APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: 'cryptomator/android'
          ref: 'main'
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Manual Android SDK and License Setup
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_HOME="$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          CMDTOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

          curl -fL --retry 5 --retry-all-errors \
            "$CMDTOLS_URL" -o "$RUNNER_TEMP/cmdtools.zip"

          unzip -q "$RUNNER_TEMP/cmdtools.zip" \
            -d "$RUNNER_TEMP"

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          mv "$RUNNER_TEMP/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          rm -f "$RUNNER_TEMP/cmdtools.zip"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

          echo "Android SDK configured successfully."

      - name: Validate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f gradlew ]]; then
            echo "::error::Gradle wrapper not found."
            exit 1
          fi

          if [[ ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            echo "::error::Gradle wrapper properties not found."
            exit 1
          fi

          chmod +x gradlew
      - name: Patch LicenseEnforcer to Bypass License Check
        run: |
          TARGET_FILE="android/presentation/src/main/java/org/cryptomator/presentation/licensing/LicenseEnforcer.kt"
          
          if [ -f "$TARGET_FILE" ]; then
            echo "Patching $TARGET_FILE..."
            cat << 'EOF' > "$TARGET_FILE"
            package org.cryptomator.presentation.licensing

            import kotlinx.coroutines.flow.Flow
            import kotlinx.coroutines.flow.flowOf

            // Custom patched LicenseEnforcer to bypass checks completely
            class LicenseEnforcer {
                val isLicensed: Flow<Boolean> = flowOf(true)
                val licenseState: Flow<LicenseState> = flowOf(LicenseState.VALID)

                fun checkLicense(): Boolean {
                    return true
                }
            }
            
            enum class LicenseState {
                VALID, EXPIRED, UNLICENSED
            }
            EOF
            echo "Successfully overwritten LicenseEnforcer.kt"
          else
            echo "Warning: LicenseEnforcer.kt not found at expected path, checking alternative paths..."
            find . -name "LicenseEnforcer.kt"
          fi
      - name: Inject License Bypass Code
        run: |
          TARGET_FILE="domain/src/main/java/org/cryptomator/domain/usecases/DoLicenseCheck.java"
          mkdir -p "$(dirname "$TARGET_FILE")"
          
          cat << 'EOF' > "$TARGET_FILE"
          package org.cryptomator.domain.usecases;
          import org.cryptomator.domain.exception.BackendException;
          import org.cryptomator.generator.Parameter;
          import org.cryptomator.generator.UseCase;
          import org.cryptomator.util.SharedPreferencesHandler;
          @UseCase
          public class DoLicenseCheck {
              private final SharedPreferencesHandler sharedPreferencesHandler;
              private String license;
              DoLicenseCheck(final SharedPreferencesHandler sharedPreferencesHandler, @Parameter final String license) {
                  this.sharedPreferencesHandler = sharedPreferencesHandler;
                  this.license = license;
              }
              public LicenseCheck execute() throws BackendException {
                  return () -> "Bypassed";
              }
          }
          EOF
          
          echo "Successfully injected license bypass code into $TARGET_FILE"

      - name: Generate Temporary Signing Keystore On-The-Fly
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias cryptomator-key \
            -keypass password123 \
            -storepass password123 \
            -dname "CN=Cryptomator Builder, OU=Dev, O=Custom, L=Unknown, ST=Unknown, C=US"

          mkdir -p app/
          cp "$RUNNER_TEMP/release.jks" app/keystore.jks

          echo "Temporary keystore generated successfully."

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Sign APK with apksigner
        shell: bash
        run: |
          set -euo pipefail

          # Dynamically search for all built APKs in the workspace
          mapfile -t APKS < <(
            find . -type f -name "*.apk" | grep -v "androidTest" || true
          )

          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "::error::Could not find any built APK in the workspace."
            exit 1
          fi

          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner not found at $APKSIGNER."
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            echo "Signing APK: $APK"
            "$APKSIGNER" sign \
              --ks app/keystore.jks \
              --ks-key-alias cryptomator-key \
              --ks-pass pass:password123 \
              --key-pass pass:password123 \
              "$APK"
            "$APKSIGNER" verify --verbose "$APK"
            echo "Successfully signed: $APK"
          done

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptomator-unlicensed-release
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
